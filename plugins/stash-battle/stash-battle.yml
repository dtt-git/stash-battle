name: Stash Battle
description: Adds an ELO based ranking system for scenes
version: 3.0.0
url: https://github.com/dtt-git/stash-battle
ui:
  javascript:
    - stash-battle.js
  css:
    - stash-battle.css
settings:
  showTiers:
    displayName: Show tiers on cards
    description: A tier next to each scene's ELO, from Legendary (top 1%) down to Bronze, by its rank among your scenes with a settled ELO. On by default.
    type: BOOLEAN
  openInNewTab:
    displayName: Open scenes in a new tab
    description: Clicking a battle thumbnail opens the scene in a new browser tab.
    type: BOOLEAN
  placementFromBottom:
    displayName: "Placement: start from the bottom"
    description: Placement ignores the scene's current ELO, starts against the bottom scene and climbs, jumping further with each win. This replaces Gauntlet.
    type: BOOLEAN
  previewVolume:
    displayName: Preview volume (0-100)
    description: Volume of hover previews. 0 mutes them.
    type: NUMBER
  autoplayPreviews:
    displayName: Autoplay previews
    description: Loop both scene previews (muted) without hovering; hover a card to hear it.
    type: BOOLEAN
  filterOpponents:
    displayName: Use filtered scenes for both sides
    description: Opponents also come from the current scene list filter.
    type: BOOLEAN
  cleanMode:
    displayName: Clean mode
    description: Show a delete button on each battle card to remove scenes from Stash.
    type: BOOLEAN
  pauseMediaOnOpen:
    displayName: Pause playing video when Stash Battle opens
    description: Stop the scene you're watching so its audio doesn't overlap the battle previews. On by default.
    type: BOOLEAN
